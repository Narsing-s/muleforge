name: Requirement to Mule Project

on:
  push:
    paths:
      - "requirements/**"
  workflow_dispatch:
    inputs:
      requirement_file:
        description: "Requirement document path under requirements/ (for example requirements/customer-api.md)"
        required: true
        type: string
      project_name:
        description: "Optional project/artifact name. Leave empty to infer it from the document."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: muleforge-requirement-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MuleForge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip

      - name: Install MuleForge
        run: npm ci

      - name: Select requirement documents
        id: requirements
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.requirement_file }}" ]; then
            FILE="${{ inputs.requirement_file }}"
            test -f "$FILE"
            echo "files=$FILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t FILES < <(find requirements -type f \( \
            -iname "*.txt" -o -iname "*.md" -o -iname "*.markdown" -o -iname "*.csv" \
            -o -iname "*.json" -o -iname "*.yaml" -o -iname "*.yml" -o -iname "*.html" \
            -o -iname "*.htm" -o -iname "*.pdf" -o -iname "*.docx" -o -iname "*.pptx" -o -iname "*.xlsx" \
          \) | sort)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No supported requirement documents were found under requirements/."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${FILES[@]}" > /tmp/muleforge-requirements.txt
          echo "files=/tmp/muleforge-requirements.txt" >> "$GITHUB_OUTPUT"

      - name: Generate project from requirement
        if: steps.requirements.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.requirements.outputs.files }}" == /tmp/* ]]; then
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue
              echo "=== Generating from $FILE ==="
              if [ -n "${{ inputs.project_name }}" ]; then
                node src/index.js analyze "$FILE" "${{ inputs.project_name }}"
                break
              fi
              node src/index.js analyze "$FILE"
            done < "${{ steps.requirements.outputs.files }}"
          else
            FILE="${{ steps.requirements.outputs.files }}"
            if [ -n "${{ inputs.project_name }}" ]; then
              node src/index.js analyze "$FILE" "${{ inputs.project_name }}"
            else
              node src/index.js analyze "$FILE"
            fi
          fi

      - name: Verify generated Mule projects
        shell: bash
        run: |
          set -euo pipefail

          FOUND=0
          while IFS= read -r CONFIG; do
            [ -n "$CONFIG" ] || continue
            FOUND=1
            echo "=== Verifying $CONFIG ==="
            node src/index.js verify "$CONFIG"
          done < <(find . -mindepth 2 -maxdepth 3 -name muleforge.yaml -not -path "./.git/*" -not -path "./node_modules/*" | sort)

          if [ "$FOUND" -eq 0 ]; then
            echo "No generated Mule project was found."
            exit 1
          fi

      - name: Commit generated project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "muleforge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A --             'requirements/*'             '*/pom.xml'             '*/mule-artifact.json'             '*/muleforge.yaml'             '*/README.md'             '*/docs'             '*/postman'             '*/src'             '*/.github'

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: generate Mule project from requirement"
          git push
