name: Deploy Mule Application to CloudHub 2.0 - DEV

on:
  workflow_dispatch:
    inputs:
      region:
        description: CloudHub 2.0 region
        required: true
        type: string
        default: us-east-1
      application_name:
        description: CloudHub application name
        required: true
        type: string
        default: customer-api-dev
      mule_runtime:
        description: Mule runtime version
        required: true
        type: string
        default: 4.9.0
      workers:
        description: Number of workers
        required: true
        type: string
        default: "1"
      worker_size:
        description: Worker size in vCores
        required: true
        type: string
        default: "0.1"
      verify:
        description: Run MuleForge verification
        required: true
        type: boolean
        default: true
      munit:
        description: Run MUnit tests
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy DEV
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: npm ci

      - name: Verify
        if: ${{ inputs.verify }}
        run: node src/index.js verify

      - name: MUnit
        if: ${{ inputs.munit }}
        run: node src/index.js test

      - name: Build and deploy to CloudHub 2.0
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_ENV_ID: ${{ secrets.ANYPOINT_ENV_ID }}
          ANYPOINT_REGION: ${{ inputs.region }}
          APP_NAME: ${{ inputs.application_name }}
          MULE_RUNTIME: ${{ inputs.mule_runtime }}
          WORKERS: ${{ inputs.workers }}
          WORKER_SIZE: ${{ inputs.worker_size }}
        run: |
          test -n "$ANYPOINT_CLIENT_ID"
          test -n "$ANYPOINT_CLIENT_SECRET"
          test -n "$ANYPOINT_ORG_ID"
          test -n "$ANYPOINT_ENV_ID"
          mvn --batch-mode clean deploy \
            -DskipTests=true \
            -DmuleDeploy \
            -Danypoint.platform.client_id="$ANYPOINT_CLIENT_ID" \
            -Danypoint.platform.client_secret="$ANYPOINT_CLIENT_SECRET" \
            -Danypoint.platform.organizationId="$ANYPOINT_ORG_ID" \
            -Danypoint.platform.environment="$ANYPOINT_ENV_ID" \
            -Danypoint.platform.region="$ANYPOINT_REGION" \
            -Danypoint.platform.applicationName="$APP_NAME" \
            -Danypoint.platform.workers="$WORKERS" \
            -Danypoint.platform.workerType="$WORKER_SIZE" \
            -Danypoint.platform.runtimeVersion="$MULE_RUNTIME"
