name: MuleForge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies\n        run: |\n          npm cache clean --force\n          npm ci --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=20000
      - run: npm test
      - run: node src/index.js --version
