name: MuleForge CI

on:
  workflow_dispatch:
    inputs:
      run_maven:
        description: "Run Maven tests for the generated reference project"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm cache clean --force
          for registry in https://registry.npmjs.org https://registry.yarnpkg.com; do
            for i in 1 2 3 4 5; do
              rm -rf ~/.npm/_cacache/tmp/* || true
              npm cache verify || true
              if npm ci --prefer-online --registry="$registry" --replace-registry-host=always --fetch-retries=8 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000; then exit 0; fi
              echo "npm ci attempt $i failed against $registry; retrying with a fresh cache"
              rm -rf ~/.npm/_cacache
              sleep $((i * 3))
            done
            echo "npm ci failed against $registry; trying the next registry"
          done
          exit 1
      - run: npm test
      - run: node src/index.js --help
      - name: Run local self-test
        run: node src/index.js self-test
      - name: Release readiness gate
        run: node src/index.js release-check .

  generated-project:
    name: Generated project quality gate
    runs-on: ubuntu-latest
    needs: cli-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm cache clean --force
          for registry in https://registry.npmjs.org https://registry.yarnpkg.com; do
            if npm ci --prefer-online --registry="$registry" --replace-registry-host=always --fetch-retries=8 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000; then exit 0; fi
            echo "npm ci failed against $registry; clearing cache and trying the next registry"
            rm -rf ~/.npm/_cacache
          done
          exit 1
      - name: Generate reference project from the confirmed model
        run: node src/index.js generate customer-api/muleforge.yaml
      - name: Contract gate
        run: node src/index.js contract-check customer-api/muleforge.yaml
      - name: Verify reference project
        run: node src/index.js verify customer-api/muleforge.yaml
      - name: Connector integrity gate
        run: node src/index.js connector-check customer-api/muleforge.yaml

      - name: Operation policy gate
        run: node src/index.js policy-check customer-api/muleforge.yaml
      - name: Generated Maven project gate
        if: success()
        run: test -f customer-api/pom.xml && test -f customer-api/mule-artifact.json
      - name: Run generated Maven tests
        if: ${{ inputs.run_maven == true }}
        working-directory: customer-api
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        run: |
          if [ -z "$MAVEN_SETTINGS_XML" ]; then
            echo "::error::MAVEN_SETTINGS_XML is required when run_maven=true."
            exit 1
          fi
          mkdir -p "$HOME/.m2"
          printf '%s' "$MAVEN_SETTINGS_XML" > "$HOME/.m2/settings.xml"
          mvn -B -s "$HOME/.m2/settings.xml" -DskipTests=false test -Dmunit.coverage.failBuild=false

      - name: Semantic IR gate
        run: node src/index.js ir-check customer-api/muleforge.yaml
      - name: Security scan
        run: node src/index.js security-scan .
      - name: Generate SBOM
        run: node src/index.js sbom .
      - name: Quality audit
        run: node src/index.js audit customer-api/muleforge.yaml
      - name: Upload generated project metadata
        uses: actions/upload-artifact@v4
        with:
          name: muleforge-verification
          path: |
            customer-api/muleforge.yaml
            customer-api/docs/**
          if-no-files-found: warn

  security:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check common hard-coded secret patterns
        shell: bash
        run: |
          if grep -RniE --exclude-dir=.git --exclude-dir=node_modules '(password|client_secret|access_token|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']' .; then
            echo "Potential hard-coded credential found. Review the result and use GitHub Secrets/environment variables instead."
            exit 1
          fi
