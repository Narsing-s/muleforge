name: MuleForge CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm cache clean --force
          for registry in https://registry.npmjs.org https://registry.yarnpkg.com; do
            for i in 1 2 3 4 5; do
              rm -rf ~/.npm/_cacache/tmp/* || true
              npm cache verify || true
              if npm ci --prefer-online --registry="$registry" --replace-registry-host=always --fetch-retries=8 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000; then exit 0; fi
              echo "npm ci attempt $i failed against $registry; retrying with a fresh cache"
              rm -rf ~/.npm/_cacache
              sleep $((i * 3))
            done
            echo "npm ci failed against $registry; trying the next registry"
          done
          exit 1
      - run: npm test
      - run: node src/index.js --help
      - name: Run local self-test
        run: node src/index.js self-test

  generated-project:
    name: Generated project quality gate
    runs-on: ubuntu-latest
    needs: cli-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm cache clean --force
          for registry in https://registry.npmjs.org https://registry.yarnpkg.com; do
            if npm ci --prefer-online --registry="$registry" --replace-registry-host=always --fetch-retries=8 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000; then exit 0; fi
            echo "npm ci failed against $registry; clearing cache and trying the next registry"
            rm -rf ~/.npm/_cacache
          done
          exit 1
      - name: Generate reference project from the confirmed model
        run: node src/index.js generate customer-api/muleforge.yaml
      - name: Contract gate
        run: node src/index.js contract-check customer-api/muleforge.yaml
      - name: Verify reference project
        run: node src/index.js verify customer-api/muleforge.yaml
      - name: Generated Maven project gate
        if: success()
        run: test -f customer-api/pom.xml && test -f customer-api/mule-artifact.json
      - name: Quality audit
        run: node src/index.js audit customer-api/muleforge.yaml
      - name: Upload generated project metadata
        uses: actions/upload-artifact@v4
        with:
          name: muleforge-verification
          path: |
            customer-api/muleforge.yaml
            customer-api/docs/**
          if-no-files-found: warn

  security:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check common hard-coded secret patterns
        shell: bash
        run: |
          if grep -RniE --exclude-dir=.git --exclude-dir=node_modules '(password|client_secret|access_token|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']' .; then
            echo "Potential hard-coded credential found. Review the result and use GitHub Secrets/environment variables instead."
            exit 1
          fi
