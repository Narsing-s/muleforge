name: MuleForge CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node src/index.js --help

  generated-project:
    name: Generated project quality gate
    runs-on: ubuntu-latest
    needs: cli-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify reference project
        run: node src/index.js verify customer-api
      - name: Upload generated project metadata
        uses: actions/upload-artifact@v4
        with:
          name: muleforge-verification
          path: |
            customer-api/muleforge.yaml
            customer-api/docs/**
          if-no-files-found: warn

  security:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check common hard-coded secret patterns
        shell: bash
        run: |
          if grep -RniE --exclude-dir=.git --exclude-dir=node_modules '(password|client_secret|access_token|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']' .; then
            echo "Potential hard-coded credential found. Review the result and use GitHub Secrets/environment variables instead."
            exit 1
          fi
