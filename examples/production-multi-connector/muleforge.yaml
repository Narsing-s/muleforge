project:
  name: customer-integration
  artifactId: customer-integration
  groupId: com.example
  version: 1.0.0
  muleRuntime: 4.9.0
  java: 17
api:
  name: Customer Integration API
  version: v1
  basePath: /api/v1
connectors:
  - database
  - sftp
  - anypoint-mq
database:
  type: snowflake
  table: CUSTOMER
operations:
  - name: Create Customer
    path: /customers
    method: POST
    connector: database
    action: insert
    requestFields:
      - name
      - email
      - mobileNumber
    responseFields:
      - customerId
      - status
    successStatus: 201
  - name: Read File
    path: /files
    method: GET
    connector: sftp
    filePath: ${sftp.filePath}
  - name: Publish Event
    path: /events
    method: POST
    connector: anypoint-mq
    destination: ${anypointmq.destination}
testing:
  munit: true
