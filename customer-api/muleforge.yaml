# Dedicated MuleForge test project model used by manual CI runs and local verification.
# CI smoke-test model: HTTP-only so generation does not require external connector credentials.
requirement: Generate a simple Mule 4 Customer API for testing MuleForge generation and verification.
project:
  name: muleforge-test-api
  artifactId: muleforge-test-api
  groupId: com.example
  version: 1.0.0
  muleRuntime: 4.9.0
  java: "17"

api:
  name: muleforge-test-api
  version: v1
  specification: RAML
  basePath: /api/v1

connectors:
  - http

operations:
  - name: getCustomer
    method: GET
    path: /customers/{customerId}
    connector: http
    requestFields: []
    responseFields:
      - name: customerId
        type: string
      - name: name
        type: string
      - name: email
        type: string
    successStatus: 200
    errors:
      - status: 404
        description: Customer not found
      - status: 500
        description: Unexpected error

  - name: createCustomer
    method: POST
    path: /customers
    connector: http
    requestFields:
      - name: name
        type: string
      - name: email
        type: string
    responseFields:
      - name: customerId
        type: string
      - name: name
        type: string
      - name: email
        type: string
    successStatus: 201
    errors:
      - status: 400
        description: Invalid request
      - status: 500
        description: Unexpected error

testing:
  munit: true

deployment:
  target: none
