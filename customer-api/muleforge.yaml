# Dedicated MuleForge test project model used by manual CI runs and local verification.
# CI smoke-test model: HTTP-only so generation does not require external connector credentials.
requirement: Generate a simple Mule 4 Customer API for testing MuleForge generation and verification.
project:
  name: muleforge-test-api
  artifactId: muleforge-test-api
  groupId: com.example
  version: 1.0.0
  muleRuntime: 4.9.0
  java: "17"

api:
  name: muleforge-test-api
  version: v1
  specification: RAML
  basePath: /api/v1

connectors:
  - http

operations:
  - name: getCustomer
    method: GET
    path: /customers/{customerId}
    connector: http
    requestFields: []
    responseFields:
      - customerId
      - name
      - email
    successStatus: 200
    errors:
      - Customer not found returns 404
      - Unexpected errors return 500

  - name: createCustomer
    method: POST
    path: /customers
    connector: http
    requestFields:
      - name
      - email
    responseFields:
      - customerId
      - name
      - email
    successStatus: 201
    errors:
      - Invalid request returns 400
      - Unexpected errors return 500

testing:
  munit: true

deployment:
  target: none
